<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Three.js Character Viewer</title>

    <style>

        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

    </style>

</head>

<body>


<!-- THREE.JS IMPORT MAP -->

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
'three/addons/controls/OrbitControls.js';


// ============================
// SCENE
// ============================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x222222);


// ============================
// CAMERA
// ============================

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.set(
    0,
    1.5,
    5
);


// ============================
// RENDERER
// ============================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

document.body.appendChild(
    renderer.domElement
);


// ============================
// LIGHTING
// ============================

const hemiLight =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    );

scene.add(hemiLight);


const directionalLight =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

directionalLight.position.set(
    3,
    5,
    3
);

scene.add(directionalLight);


// ============================
// CHARACTER
// ============================

const loader =
    new GLTFLoader();


loader.load(
    './character.glb',

    (gltf) => {

        const character = gltf.scene;

        character.position.set(0, 0, 0);

        scene.add(character);


        // ============================
        // FIND CHARACTER CENTER
        // ============================

        const box = new THREE.Box3().setFromObject(character);

        const center = new THREE.Vector3();

        box.getCenter(center);


        // Make OrbitControls focus
        // exactly on the character

        controls.target.copy(center);


        // Update controls

        controls.update();


        console.log("Character center:", center);

    },

    (progress) => {

        if (progress.total > 0) {

            console.log(
                'Loading:',
                (
                    progress.loaded /
                    progress.total *
                    100
                ).toFixed(1) + '%'
            );

        }

    },

    (error) => {

        console.error(
            'GLB ERROR:',
            error
        );

    }
);


// ============================
// ORBIT CONTROLS
// ============================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );


// Where the camera looks
controls.target.set(
    100,
    10,
    0
);


// Smooth movement
controls.enableDamping = true;

controls.dampingFactor = 0.08;


// Disable panning
controls.enablePan = false;


// Zoom limits
controls.minDistance = 2;
controls.maxDistance = 8;


// Vertical rotation limits
controls.minPolarAngle =
    Math.PI * 0.2;

controls.maxPolarAngle =
    Math.PI * 0.8;


// Rotation speed
controls.rotateSpeed = 0.7;


// Zoom speed
controls.zoomSpeed = 0.8;


// ============================
// LOOP
// ============================

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();

// ============================
// RESIZE
// ============================

window.addEventListener(
    'resize',
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>

</html>

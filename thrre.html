<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Three.js Character</title>

    <style>

        body {
            margin: 0;
            overflow: hidden;
        }

    </style>

</head>

<body>


<!-- THREE.JS IMPORT MAP -->

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>


<script type="module">

import { OrbitControls } from
'three/addons/controls/OrbitControls.js';

import * as THREE from 'three';

import { GLTFLoader } from
'three/addons/loaders/GLTFLoader.js';


// ============================
// SCENE
// ============================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x222222);


// ============================
// CAMERA
// ============================

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.set(
    0,
    1.5,
    5
);


// ============================
// RENDERER
// ============================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

document.body.appendChild(
    renderer.domElement
);


// ============================
// LIGHT
// ============================

const hemiLight =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    );

scene.add(hemiLight);


const directionalLight =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

directionalLight.position.set(
    3,
    5,
    3
);

scene.add(directionalLight);


// ============================
// GLB
// ============================

const loader =
    new GLTFLoader();

let mixer = null;

const clock =
    new THREE.Clock();


loader.load(

    './character.glb',

    (gltf) => {

        console.log(
            'Character loaded!'
        );

        console.log(
            'Animations:',
            gltf.animations
        );


        const character =
            gltf.scene;


        character.position.set(
            0,
            0,
            0
        );


        character.scale.setScalar(
            1
        );


        scene.add(
            character
        );


        // ====================
        // ANIMATION
        // ====================

        if (
            gltf.animations.length > 0
        ) {

            mixer =
                new THREE.AnimationMixer(
                    character
                );


            const action =
                mixer.clipAction(
                    gltf.animations[0]
                );


            action.play();


            console.log(
                'Playing:',
                gltf.animations[0].name
            );

        }
        else {

            console.log(
                'No animations found.'
            );

        }

    },


    // Loading progress

    (progress) => {

        if (progress.total > 0) {

            console.log(
                'Loading:',
                (
                    progress.loaded /
                    progress.total *
                    100
                ).toFixed(1) + '%'
            );

        }

    },


    // Error

    (error) => {

        console.error(
            'GLB ERROR:',
            error
        );

    }

);

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.target.set(0, 1, 0);

controls.enableDamping = true;

controls.enablePan = false;

controls.minDistance = 2;
controls.maxDistance = 8;

controls.minPolarAngle = Math.PI * 0.2;
controls.maxPolarAngle = Math.PI * 0.8;
// ============================
// LOOP
// ============================

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    if (mixer) {

        mixer.update(
            delta
        );

    }


    renderer.render(
        scene,
        camera
    );

}

animate();


// ============================
// RESIZE
// ============================

window.addEventListener(
    'resize',
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>

</html>
